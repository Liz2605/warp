<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lời chúc của Cua xinh gái</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="--hero-image: url(&quot;assets/nen.jpg&quot;)">
    <div class="cursor-glow"></div>
    <div class="floating-bg"></div>

    <nav class="navbar glass">
      <a href="index.html" class="logo">Cua xinh gái</a>
      <div class="nav-links"></div>
    </nav>

    <button class="music-btn" id="musicBtn">♪</button>

    <main class="hero page-section">
      <div class="hero-overlay"></div>
      <section class="hero-content reveal">
        <p class="script-text">あなたへの、ちょっとしたこと !</p>
        <h1>
          国際男性デー、おめでとうございます <br /><span>
            いつも私をかばい、守ってくれる人
          </span>
        </h1>
        <p class="hero-desc">
          今日があなたにとって、楽しく素晴らしい一日となりますように。この素敵な一日を、存分に楽しんでくださいね！！！
        </p>
        <div class="hero-actions">
          <a class="btn primary" href="cake.html">お祝いしよう！</a>
          <a class="btn ghost" href="letter.html"
            >私のメッセージを聞くには、ここをクリックしてください</a
          >
        </div>
      </section>

      <aside class="countdown-card glass reveal delay-1">
        <p class="script-text">楽しめる時間は、まだ……</p>
        <div class="countdown" id="countdown">
          <div><strong id="days">00</strong><span>Days</span></div>
          <div><strong id="hours">00</strong><span>Hours</span></div>
          <div><strong id="mins">00</strong><span>Mins</span></div>
          <div><strong id="secs">00</strong><span>Secs</span></div>
        </div>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
